name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test,pydantic,yaml,django,fastapi]
    - name: Run tests (excluding benchmarks)
      run: pytest -m "not benchmark" --benchmark-skip
    - name: Run benchmarks (only on main branch or PR)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: pytest tests/test_performance.py --benchmark-only --benchmark-json=benchmark.json
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-${{ matrix.python-version }}
        path: benchmark.json
