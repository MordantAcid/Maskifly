[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maskinfly"
version = "0.2.5"
description = "Библиотека для маскировки чувствительных данных (пароли, токены, и т.д.) в строках, словарях и списках"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "MordantAcid", email = "cagej7517@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["masking", "data-masking", "privacy", "security", "pii", "secrets", "autograd", "neural-networks"]
dependencies = [
    "numpy>=1.22.0"
]

[project.scripts]
maskinfly = "maskinfly.cli:main"

[project.optional-dependencies]
pydantic = ["pydantic>=2.0.0"]
yaml = ["pyyaml>=6.0"]
django = ["django>=3.2"]
fastapi = ["fastapi>=0.95.0"]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-django>=4.5",
    "pytest-mock>=3.10",
    "pytest-benchmark>=4.0.0",
    "django>=3.2",
    "fastapi>=0.100",
    "starlette>=0.27",
    "pyyaml>=6.0"
]
dev = [
    "maskinfly[pydantic,yaml,test]",
    "black>=22.0",
    "isort>=5.10",
    "mypy>=0.990"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["maskinfly*"]

[tool.pytest.ini_options]
addopts = ""
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as async",
    "django_db: mark test as using django database",
    "benchmark: marks performance tests",
]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[project.urls]
Homepage = "https://github.com/MordantAcid/maskifly"
Repository = "https://github.com/MordantAcid/maskifly.git"
